[project]
name = "trading-bot"
version = "0.1.0"
description = "24/7 AI trading bot driven by Claude Opus 4.7 routines"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "pandas-market-calendars>=4.4.0",
    "pydantic>=2.7.0",
    "tenacity>=8.2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.3.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
ibkr = ["ib-async>=1.0.1"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
